name: 프리장 시세

on:
  workflow_dispatch:           # 필요한 날만 켠다 — 화면 안내 칸 '서버에서 받기 시작' 또는 GitHub Actions의 Run workflow
  # 예약 실행은 두지 않는다 (2026-11-25 사용자: 프리장은 많이 떨어지는 날만 보고 싶다, 늘 돌리는 건 심하다)

concurrency:                   # 한 번에 하나만 — 도는 중에 또 켜면 기다렸다가 바로 끝난다
  group: pre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - name: 9:30까지 10분마다 Webull 프리장 시세 → pre.json
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          python3 -u pre.py --loop
