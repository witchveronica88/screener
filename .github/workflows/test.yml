name: 계산 시험

on:
  push:                        # 계산 코드나 종목 목록이 바뀌면 시험한다
    paths: ['*.py', etfs.json, test_data.json, .github/workflows/test.yml]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 시험
        run: python3 tests.py
