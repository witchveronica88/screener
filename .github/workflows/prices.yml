name: 종가 수집

on:
  schedule:
    - cron: '0 22 * * 1-5'   # 월~금 22:00 UTC = 한국 화~토 07:00 (미국 장 마감 뒤 확정 종가)
  workflow_dispatch:           # 수동 실행 버튼
  push:                        # 종목을 추가·삭제하면 바로 수집
    branches: [main]
    paths: [tickers.txt, etfs.json]

concurrency:                   # 겹쳐 실행되지 않게 순서대로
  group: prices
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 종가 수집
        run: python3 -u prices.py

      - name: 상황판 계산
        continue-on-error: true    # 상황판이 실패해도 종가는 저장한다
        run: python3 -u desk.py

      - name: 커밋
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add data.json desk.json desk_log.json
          git diff --staged --quiet || git commit -m "종가 갱신 $(date -u +%Y-%m-%d)"
          git pull --rebase origin main   # 실행 중 tickers.txt가 바뀌었어도 푸시되게
          git push
