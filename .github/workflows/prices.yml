name: 종가 수집

on:
  schedule:
    - cron: '0 22 * * 1-5'   # 월~금 22:00 UTC = 한국 화~토 07:00 (미국 장 마감 뒤 확정 종가)
  workflow_dispatch:           # 수동 실행 버튼
  push:                        # 종목을 추가·삭제하면 바로 수집
    branches: [main]
    paths: [tickers.txt]

concurrency:                   # 겹쳐 실행되지 않게 순서대로
  group: prices
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 데이터 수집
        run: |
          python3 -u << 'EOF'
          import urllib.request, csv, io, json, math, time, datetime, os, sys
          from zoneinfo import ZoneInfo

          BASE = """SOLT ETHU DPST RAM LABU BITX GDXU YINN RETL NAIL URAA
          JNUG CWEB KORU WEBL HIBL MEXX DFEN INDL NUGT TPOR PILL TNA MIDU BRZU
          GUSH UTSL TECL WANT DRN EDC QQQU AGQ DUSL AIBU EURL FAS TMF CURE UBOT
          CHAU ERX UDOW TYD UGL SOXL""".split()

          # tickers.txt — 개별주식 등 직접 추가한 티커 (한 줄에 하나, # 뒤는 메모)
          EXTRA = []
          if os.path.exists('tickers.txt'):
              for line in open('tickers.txt', encoding='utf-8'):
                  t = line.split('#')[0].strip().upper()
                  if t and t not in BASE and t not in EXTRA:
                      EXTRA.append(t)
          TICKERS = BASE + EXTRA
          print(f'대상 {len(TICKERS)}종목 (기본 {len(BASE)} + 추가 {len(EXTRA)})')
          if EXTRA:
              print('추가 종목:', ' '.join(EXTRA))

          UA = {'User-Agent': 'Mozilla/5.0'}

          def get_csv(url, timeout=25):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read().decode('utf-8', 'replace')

          def num(x):
              """숫자로 바꾸고, 비었거나 숫자가 아니면 None"""
              try:
                  v = float(x)
                  return v if v == v else None
              except (TypeError, ValueError):
                  return None

          STOOQ_OFF = False   # Stooq가 연달아 실패하면 그날은 건너뛴다 (시간 초과로 수집이 몇십 분씩 늘어지는 것 방지)
          stooq_fail = 0

          def confirmed(out):
              """장이 아직 안 끝난 오늘 봉은 확정 종가가 아니므로 뺀다 (장중에 tickers.txt를 고쳐 실행된 경우).
                 상황판(desk.py)과 같은 기준: 뉴욕 날짜가 오늘이고 16:15 전"""
              ny = datetime.datetime.now(ZoneInfo('America/New_York'))
              if out and out[-1][0] == ny.date().isoformat() and (ny.hour, ny.minute) < (16, 15):
                  out = out[:-1]
              return out

          def history(tk):
              """일봉 (날짜, 종가, 거래량, 수정종가) 리스트 반환 (오래된 순). Yahoo 전체 이력 → 실패 시 Stooq"""
              global STOOQ_OFF, stooq_fail
              try:
                  # range=max는 월봉으로 바뀌므로 period1=0으로 전체 일봉을 받는다
                  url = (f'https://query1.finance.yahoo.com/v8/finance/chart/{tk}'
                         f'?period1=0&period2={int(time.time())}&interval=1d')
                  req = urllib.request.Request(url, headers=UA)
                  with urllib.request.urlopen(req, timeout=25) as r:
                      j = json.load(r)
                  res = j['chart']['result'][0]
                  ts = res['timestamp']
                  q = res['indicators']['quote'][0]
                  cl = q['close']
                  vo = q.get('volume') or [None] * len(cl)
                  # 수정종가(배당 반영) — 기초자산 대비 수익률 비교에만 쓴다
                  ad = ((res['indicators'].get('adjclose') or [{}])[0].get('adjclose')) or cl
                  out = [(datetime.date.fromtimestamp(t).isoformat(), c, num(v), a if a is not None else c)
                         for t, c, v, a in zip(ts, cl, vo, ad) if c is not None]
                  out = confirmed(out)
                  if out:
                      return out
              except Exception as e:
                  print(f'  yahoo 실패 {tk}: {e}')
              if STOOQ_OFF:
                  return []
              try:
                  txt = get_csv(f'https://stooq.com/q/d/l/?s={tk.lower()}.us&i=d', timeout=10)
                  rows = list(csv.DictReader(io.StringIO(txt)))
                  out = [(r['Date'], float(r['Close']), num(r.get('Volume')), float(r['Close']))
                         for r in rows if r.get('Close') not in (None, '', 'N/A')]
                  out = confirmed(out)
                  stooq_fail = 0
                  if len(out) >= 30:
                      return out
              except Exception as e:
                  print(f'  stooq 실패 {tk}: {e}')
                  stooq_fail += 1
                  if stooq_fail >= 3:
                      STOOQ_OFF = True
                      print('  stooq 3회 연속 실패 — 이번 수집에서는 건너뜀')
              return []

          def maxdd(closes):
              """보유 이력 전체에서 고점 대비 최대 하락폭 (%)"""
              peak = closes[0]; worst = 0.0
              for c in closes:
                  if c > peak: peak = c
                  d = c / peak - 1
                  if d < worst: worst = d
              return worst * 100

          def rsi(closes, period=14):
              """Wilder RSI"""
              if len(closes) < period + 1:
                  return None
              d = [closes[i] - closes[i-1] for i in range(1, len(closes))]
              g = sum(x for x in d[:period] if x > 0) / period
              l = sum(-x for x in d[:period] if x < 0) / period
              for x in d[period:]:
                  g = (g * (period-1) + max(x, 0)) / period
                  l = (l * (period-1) + max(-x, 0)) / period
              if l == 0:
                  return 100.0
              return 100 - 100 / (1 + g / l)

          def sigma(closes, n=250):
              """최근 n거래일 일간 변동성 (%). 250일=구조적, 60일=최근 국면
                 반환: (변동성, 사용한 수익률 개수)"""
              c = closes[-(n+1):]
              if len(c) < 21:
                  return None, 0
              r = [math.log(c[i]/c[i-1]) for i in range(1, len(c)) if c[i-1] > 0]
              m = sum(r) / len(r)
              v = sum((x-m)**2 for x in r) / (len(r)-1)
              return math.sqrt(v) * 100, len(r)

          def corr(a, b, days):
              """기준 거래일 구간에서 두 종목 모두 종가가 있는 날의 일간 로그수익률 상관"""
              xs, ys = [], []
              for d0, d1 in zip(days, days[1:]):
                  if d0 in a and d1 in a and d0 in b and d1 in b and a[d0] > 0 and b[d0] > 0:
                      xs.append(math.log(a[d1] / a[d0]))
                      ys.append(math.log(b[d1] / b[d0]))
              n = len(xs)
              if n < 60:
                  return None
              mx, my = sum(xs) / n, sum(ys) / n
              sxy = sum((x - mx) * (y - my) for x, y in zip(xs, ys))
              sxx = sum((x - mx) ** 2 for x in xs)
              syy = sum((y - my) ** 2 for y in ys)
              return sxy / math.sqrt(sxx * syy) if sxx > 0 and syy > 0 else None

          # 레버리지 상품 → (참조 ETF, 일일 배수). index.html 종목 표 D의 배수·참조ETF 열과 같게 유지한다.
          # 참조 ETF는 기초지수와 완전히 같지 않을 수 있는 근사치다.
          REF = {}
          for row in """SOXL:SOXX:3 TNA:IWM:3 TMF:TLT:3 TYD:IEF:3 NAIL:ITB:3 DRN:XLRE:3 UTSL:XLU:3 NUGT:GDX:2
          GDXU:GDX:3 JNUG:GDXJ:2 UGL:GLD:2 AGQ:SLV:2 ERX:XLE:2 GUSH:XOP:2 UDOW:DIA:3 HIBL:SPHB:3 MIDU:IJH:3
          FAS:XLF:3 DPST:KRE:3 DUSL:XLI:3 TPOR:XTN:3 WANT:XLY:3 RETL:XRT:3 LABU:XBI:3 CURE:XLV:3 PILL:XPH:3
          DFEN:ITA:3 URAA:URA:2 TECL:XLK:3 WEBL:FDN:3 UBOT:BOTZ:2 QQQU:MAGS:2 YINN:FXI:3 CWEB:KWEB:2
          CHAU:ASHR:2 INDL:INDA:2 EDC:EEM:3 KORU:EWY:3 EURL:VGK:3 BRZU:EWZ:2 MEXX:EWW:3 BITX:IBIT:2
          ETHU:ETHA:2""".split():
              a, b, c = row.split(':')
              REF[a] = (b, int(c))

          RISK_N = 750   # 급락 위험을 재는 공통 구간: 최근 3년(750거래일)

          def tail_loss(closes, k):
              """최근 3년 k일 수익률의 하위 5% 평균 (%). 반환: (평균, 꼬리 표본 수) — 표본 5개 미만이면 None"""
              c = closes[-(RISK_N + 1):]
              r = sorted(c[i] / c[i-k] - 1 for i in range(k, len(c)) if c[i-k] > 0)
              n = int(len(r) * 0.05)
              if n < 5:
                  return None, n
              return sum(r[:n]) / n * 100, n

          def underwater(dates, closes):
              """고점을 되찾는 데 걸린 기간(달력 일수). 반환: (끝난 회복 중 최장, 지금 미회복 기간)"""
              day = datetime.date.fromisoformat
              peak = closes[0]; pi = 0; longest = 0
              for i, c in enumerate(closes):
                  if c >= peak:
                      if i - pi > 1:
                          longest = max(longest, (day(dates[i]) - day(dates[pi])).days)
                      peak = c; pi = i
              return longest, (day(dates[-1]) - day(dates[pi])).days

          def soxl_crash(a, b, days):
              """SOXL 수익률 하위 10%인 날, 이 종목이 얼마나 같이 빠지나.
                 반환: (그날 이 종목 평균 %, 그날 SOXL 평균 %, 그날끼리의 상관, 일수) — 20일 미만이면 None"""
              pr = []
              for d0, d1 in zip(days, days[1:]):
                  if d0 in b and d1 in b and b[d0] > 0:
                      pr.append((b[d1] / b[d0] - 1, d0, d1))
              pr.sort()
              cut = pr[:int(len(pr) * 0.10)]
              xs, ys = [], []
              for rb, d0, d1 in cut:
                  if d0 in a and d1 in a and a[d0] > 0:
                      xs.append(a[d1] / a[d0] - 1); ys.append(rb)
              n = len(xs)
              if n < 20:
                  return None
              mx, my = sum(xs) / n, sum(ys) / n
              sxy = sum((x - mx) * (y - my) for x, y in zip(xs, ys))
              sxx = sum((x - mx) ** 2 for x in xs); syy = sum((y - my) ** 2 for y in ys)
              return mx * 100, my * 100, (sxy / math.sqrt(sxx * syy) if sxx > 0 and syy > 0 else None), n

          # 지난 수집 결과 — 이번에 실패한 종목은 이 값을 그대로 둔다
          try:
              prev = json.load(open('data.json', encoding='utf-8')).get('data', {})
          except Exception:
              prev = {}

          data = {}
          series = {}   # 상관 계산용 {티커: {날짜: 종가}}
          adj = {}      # 기초자산 대비 비교용 {티커: {날짜: 수정종가}} 최근 1년 남짓
          for tk in TICKERS:
              h = history(tk)
              if not h:
                  print(f'{tk}: 데이터 없음' + (' — 지난 값 유지' if tk in prev else ''))
                  continue
              dates = [d for d, _, _, _ in h]
              closes = [c for _, c, _, _ in h]
              vols = [v for _, _, v, _ in h]
              tv = [c * v for c, v in zip(closes[-20:], vols[-20:]) if v]   # 최근 20일 거래대금
              peak = max(closes)
              c1y = closes[-250:]
              peak1y = max(c1y)
              s1, sn1 = sigma(closes, 250)
              s2, _   = sigma(closes, 60)
              es1, esn = tail_loss(closes, 1)
              es5, _ = tail_loss(closes, 5)
              uwMax, uwNow = underwater(dates, closes)
              rec = {
                  'price': round(closes[-1], 2),
                  'date': dates[-1],
                  'chg': round((closes[-1]/closes[-2] - 1) * 100, 2) if len(closes) > 1 else None,
                  'rsi': round(r14, 1) if (r14 := rsi(closes)) is not None else None,
                  'sig': round(s1, 2) if s1 is not None else None,
                  'sigN': sn1,
                  'sig60': round(s2, 2) if s2 is not None else None,
                  'dd': round((closes[-1]/peak - 1) * 100, 1),
                  'peak': round(peak, 2),
                  'dd1y': round((closes[-1]/peak1y - 1) * 100, 1),
                  'peak1y': round(peak1y, 2),
                  'mddCalc': round(maxdd(closes), 1),
                  'bars': len(closes),
                  'dv': round(sum(tv) / len(tv) / 1e6, 1) if tv else None,   # 하루 평균 거래대금 ($M)
                  # 급락 위험 — 최근 3년 공통 구간 (상장이 짧으면 있는 만큼, riskBars로 표시)
                  'es1': round(es1, 1) if es1 is not None else None,    # 하루 수익률 하위 5% 평균
                  'es5': round(es5, 1) if es5 is not None else None,    # 5거래일 누적 수익률 하위 5% 평균
                  'esN': esn,                                           # 하위 5%에 든 날 수
                  'mdd3y': round(maxdd(closes[-RISK_N:]), 1),
                  'riskBars': min(len(closes), RISK_N),
                  'uwMax': uwMax,                                       # 과거 최장 회복 기간 (달력 일수)
                  'uwNow': uwNow,                                       # 지금 역대 고점 밑에 머문 기간
              }
              data[tk] = rec
              series[tk] = dict(zip(dates, closes))
              adj[tk] = {d: a for d, _, _, a in h[-260:]}
              print(f"{tk}: ${rec['price']} RSI {rec['rsi']} σ {rec['sig']}%({rec['sigN']}일) 역대 {rec['dd']}% 1년 {rec['dd1y']}% 거래대금 ${rec['dv']}M")
              time.sleep(0.4)

          # 최근 1년(SOXL 거래일 기준) 상관 — SOXL 상관, 서로 비슷하게 움직이는 종목(0.7 이상)
          if 'SOXL' in series:
              days = sorted(series['SOXL'])[-251:]
              tks = list(series)
              for tk in tks:
                  if tk == 'SOXL':
                      continue   # 기준 종목 자신은 상관을 매기지 않는다
                  c = corr(series[tk], series['SOXL'], days)
                  data[tk]['corr'] = round(c, 2) if c is not None else None
              for i, a in enumerate(tks):
                  for b in tks[i+1:]:
                      c = corr(series[a], series[b], days)
                      if c is not None and c >= 0.7:
                          data[a].setdefault('peers', []).append([b, round(c, 2)])
                          data[b].setdefault('peers', []).append([a, round(c, 2)])
              for tk in tks:
                  if 'peers' in data[tk]:
                      data[tk]['peers'].sort(key=lambda x: -x[1])
              print('SOXL 상관:', ' '.join(f"{t} {data[t].get('corr')}" for t in tks))

              # SOXL 급락일(최근 3년 하위 10%) 동반 하락
              days3 = sorted(series['SOXL'])[-(RISK_N + 1):]
              for tk in tks:
                  if tk == 'SOXL':
                      continue
                  x = soxl_crash(series[tk], series['SOXL'], days3)
                  if x:
                      data[tk]['crash'] = {'me': round(x[0], 1), 'soxl': round(x[1], 1),
                                           'corr': round(x[2], 2) if x[2] is not None else None, 'n': x[3]}

          # 기초자산(참조 ETF) 대비 최근 1년 수익률 — 수정종가 기준, 두 종목 모두 값이 있는 날만
          refh = {}
          for tk, (ref, lev) in REF.items():
              if tk not in adj:
                  continue
              if ref not in refh:
                  refh[ref] = {d: a for d, _, _, a in history(ref)[-260:]}
                  time.sleep(0.4)
              ds = sorted(d for d in adj[tk] if d in refh[ref])[-251:]
              if len(ds) < 60:
                  continue
              base = refh[ref][ds[-1]] / refh[ref][ds[0]] - 1
              prod = adj[tk][ds[-1]] / adj[tk][ds[0]] - 1
              data[tk]['ref'] = {'t': ref, 'lev': lev, 'base': round(base * 100, 1), 'prod': round(prod * 100, 1),
                                 'gap': round((prod - lev * base) * 100, 1), 'n': len(ds) - 1}
          print('기초자산 대비:', ' '.join(f"{t} {data[t]['ref']['gap']:+}%p" for t in data if 'ref' in data[t]))

          fresh = len(data)
          if fresh < len(TICKERS) / 2:
              # 데이터 출처가 통째로 막힌 날 — 빈 data.json으로 덮어쓰지 않는다
              print(f'\n수집 {fresh}/{len(TICKERS)}종목뿐이라 저장하지 않고 중단')
              sys.exit(1)
          for tk in TICKERS:
              if tk not in data and tk in prev:
                  data[tk] = {**prev[tk], 'stale': True}

          out = {
              'updated': datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='minutes'),
              'count': len(data),
              'data': data,
          }
          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False, indent=1)
          stale = [t for t in TICKERS if data.get(t, {}).get('stale')]
          missing = [t for t in TICKERS if t not in data]
          print(f'\n완료 — 새로 받음 {fresh}/{len(TICKERS)}종목')
          if stale:
              print('지난 값 유지:', ' '.join(stale))
          if missing:
              print('실패:', ' '.join(missing))
          EOF

      - name: 상황판 계산
        continue-on-error: true    # 상황판이 실패해도 종가는 저장한다
        run: python3 -u desk.py

      - name: 커밋
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add data.json desk.json desk_log.json
          git diff --staged --quiet || git commit -m "종가 갱신 $(date -u +%Y-%m-%d)"
          git pull --rebase origin main   # 실행 중 tickers.txt가 바뀌었어도 푸시되게
          git push
